spring.application.name=pulsos-medicina-pro
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:pulsosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB

# Base de datos local persistente (se creará una carpeta 'data' en tu proyecto)
spring.datasource.url=jdbc:h2:file:./data/pulsosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mantiene la estructura de las tablas y los datos intactos
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

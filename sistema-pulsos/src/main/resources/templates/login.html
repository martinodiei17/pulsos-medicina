<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | Pulsos - Medicina & Bienestar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-primario: #485A48;
            --verde-hover: #364436;
            --crema-fondo: #FAF7F5;
            --blanco: #FFFFFF;
            --arena-linea: #E3DDD8;
            --dorado-acento: #A08C75;
            --texto-oscuro: #2D342D;
            --texto-secundario: #6C756C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--crema-fondo);
            color: var(--texto-oscuro);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--blanco);
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            border: 1px solid var(--arena-linea);
            padding: 45px 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            letter-spacing: 6px;
            color: var(--verde-primario);
            font-weight: 600;
        }

        .brand span {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dorado-acento);
            display: block;
            margin-top: 4px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: var(--texto-secundario);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--arena-linea);
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            background: #FAFAFA;
        }

        input:focus {
            border-color: var(--verde-primario);
            background: #FFF;
        }

        .btn-login {
            width: 100%;
            background-color: var(--verde-primario);
            color: #fff;
            padding: 13px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: var(--verde-hover);
        }

        .demo-roles {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--arena-linea);
            font-size: 0.78rem;
            color: var(--texto-secundario);
            text-align: left;
            background: #FCFBFA;
            padding: 15px;
            border-radius: 6px;
        }

        .alert-error {
            background: #FDF4F4;
            color: #902B2B;
            border: 1px solid #F5C6CB;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <h1>P U L S O S</h1>
        <span>Medicina & Bienestar</span>
    </div>

    <div th:if="${param.error}" class="alert-error">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert-error" style="background:#EBF5EC; color:#2E6930; border-color:#C3E6CB;">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" required autofocus placeholder="Usuario o email">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required placeholder="Contraseña">
        </div>
        <button type="submit" class="btn-login">Ingresar al Sistema</button>
    </form>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion != null and esEdicion} ? 'Editar Profesional | Pulsos' : 'Nuevo Profesional | Pulsos'">Gestión de Profesional | Pulsos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-primario: #485A48;
            --verde-hover: #364436;
            --verde-tenue: #EEF2EE;
            --crema-fondo: #FAF7F5;
            --blanco: #FFFFFF;
            --arena-linea: #E3DDD8;
            --dorado-acento: #A08C75;
            --texto-oscuro: #2D342D;
            --texto-secundario: #6C756C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--crema-fondo);
            color: var(--texto-oscuro);
            line-height: 1.6;
        }

        header {
            background-color: var(--blanco);
            border-bottom: 1px solid var(--arena-linea);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            letter-spacing: 5px;
            color: var(--verde-primario);
            font-weight: 600;
        }

        .brand span {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--dorado-acento);
            display: block;
        }

        nav a {
            color: var(--texto-oscuro);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 25px;
            padding-bottom: 4px;
        }

        nav a.active {
            color: var(--verde-primario);
            border-bottom: 2px solid var(--verde-primario);
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card-form {
            background: var(--blanco);
            border-radius: 8px;
            border: 1px solid var(--arena-linea);
            padding: 35px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .form-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--verde-primario);
            font-weight: 600;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--arena-linea);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            color: var(--texto-secundario);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--arena-linea);
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            background: var(--blanco);
            color: var(--texto-oscuro);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--verde-primario);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--verde-primario);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.9rem;
            color: var(--texto-oscuro);
            font-weight: 500;
            cursor: pointer;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--arena-linea);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--verde-primario);
            color: #fff;
            padding: 11px 26px;
            border-radius: 6px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--verde-hover); }

        .btn-outline {
            background-color: transparent;
            color: var(--verde-primario);
            border: 1px solid var(--verde-primario);
        }

        .btn-outline:hover { background-color: var(--verde-tenue); }

        .helper-text {
            font-size: 0.75rem;
            color: var(--texto-secundario);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <h1>P U L S O S</h1>
        <span>Medicina & Bienestar</span>
    </div>
    <nav>
        <a href="/turnos">Agenda de Turnos</a>
        <a href="/pacientes">Pacientes & Historias</a>
        <a href="/usuarios" class="active" sec:authorize="hasRole('ROLE_ADMIN')">👥 Profesionales / Usuarios</a>
    </nav>
    <div style="font-size: 0.8rem; display: flex; align-items: center; gap: 15px;">
        <span>Usuario: <strong sec:authentication="name">Admin</strong></span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.7rem;">Salir</button>
        </form>
    </div>
</header>

<div class="container">
    <div class="card-form">
        <h2 class="form-title" th:text="${esEdicion != null and esEdicion} ? 'Editar Profesional / Usuario' : 'Nuevo Profesional / Usuario'">
            Nuevo Profesional / Usuario
        </h2>

        <form th:action="@{/usuarios/guardar}" method="post">
            <input type="hidden" name="id" th:value="${usuario?.id}" />

            <div class="form-grid">
                <!-- Nombre Completo -->
                <div class="form-group full-width">
                    <label for="nombreCompleto">Nombre y Apellido / Profesional</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" th:value="${usuario?.nombreCompleto}" required placeholder="Ej: Dr. Juan Pérez">
                </div>

                <!-- Usuario Login -->
                <div class="form-group">
                    <label for="username">Usuario (Login)</label>
                    <input type="text" id="username" name="username" th:value="${usuario?.username}" required placeholder="Ej: jperez">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" th:value="${usuario?.email}" placeholder="correo@pulsos.com">
                </div>

                <!-- Especialidad -->
                <div class="form-group">
                    <label for="especialidad">Especialidad</label>
                    <input type="text" id="especialidad" name="especialidad" th:value="${usuario?.especialidad}" placeholder="Ej: Cardiología, Clínica">
                </div>

                <!-- Matrícula -->
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" name="matricula" th:value="${usuario?.matricula}" placeholder="Ej: MN 12345">
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="passwordPlana">Contraseña</label>
                    <input type="password" id="passwordPlana" name="passwordPlana" th:required="${esEdicion == null or !esEdicion}" placeholder="••••••••">
                    <span class="helper-text" th:if="${esEdicion != null and esEdicion}">Dejar en blanco para conservar la actual.</span>
                </div>

                <!-- Rol -->
                <div class="form-group">
                    <label for="rol">Rol Asignado</label>
                    <select id="rol" name="rol" required>
                        <option value="" disabled selected>Selecciona un rol...</option>
                        <option th:each="r : ${todosLosRoles}" 
                                th:value="${r}" 
                                th:text="${r}">
                        </option>
                    </select>
                </div>

                <!-- Estado Activo -->
                <div class="form-group full-width">
                    <div class="checkbox-group">
                        <input type="checkbox" id="activo" name="activo" th:checked="${usuario?.activo != null ? usuario.activo : true}">
                        <label for="activo">Usuario / Profesional Activo en el Sistema</label>
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/usuarios" class="btn btn-outline">← Volver</a>
                <button type="submit" class="btn">Guardar Profesional</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

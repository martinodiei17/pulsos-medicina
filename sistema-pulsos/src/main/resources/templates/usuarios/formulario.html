<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuario | Pulsos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #FAF7F5; color: #2D342D; line-height: 1.6; }
        header { background-color: #FFFFFF; border-bottom: 1px solid #E3DDD8; padding: 18px 8%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 40px auto 60px auto; padding: 0 20px; }
        .card-form { background: #FFFFFF; border-radius: 8px; border: 1px solid #E3DDD8; padding: 35px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .form-title { font-size: 1.3rem; color: #485A48; font-weight: 600; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #E3DDD8; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; color: #6C756C; }
        input, select { width: 100%; padding: 11px 14px; border: 1px solid #E3DDD8; border-radius: 6px; font-size: 0.9rem; background: #FFFFFF; color: #2D342D; outline: none; }
        input:focus, select:focus { border-color: #485A48; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #E3DDD8; }
        .btn { background-color: #485A48; color: #fff; padding: 12px 28px; border-radius: 6px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; text-decoration: none; border: none; cursor: pointer; font-weight: 600; }
        .btn:hover { background-color: #364436; }
        .btn-outline { background-color: transparent; color: #485A48; border: 1px solid #485A48; padding: 6px 14px; font-size: 0.75rem; text-decoration: none; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .helper-text { font-size: 0.75rem; color: #6C756C; margin-top: 4px; }
    </style>
</head>
<body>

<header>
    <div><h1 style="font-size: 1.5rem; color: #485A48; letter-spacing: 3px;">P U L S O S</h1></div>
    <div><a href="/usuarios" class="btn-outline">Volver al Listado</a></div>
</header>

<div class="container">
    <div class="card-form">
        <h2 class="form-title">Editar Profesional / Usuario</h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="nombreCompleto">Nombre y Apellido</label>
                    <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" required>
                </div>

                <div class="form-group">
                    <label for="username">Usuario (Login)</label>
                    <input type="text" id="username" th:field="*{username}" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}">
                </div>

                <div class="form-group">
                    <label for="especialidad">Especialidad</label>
                    <input type="text" id="especialidad" th:field="*{especialidad}">
                </div>

                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" th:field="*{matricula}">
                </div>

                <div class="form-group">
                    <label for="passwordPlana">Contraseña</label>
                    <input type="password" id="passwordPlana" name="passwordPlana" placeholder="••••••••">
                    <span class="helper-text">Dejar en blanco para conservar la actual.</span>
                </div>

                <div class="form-group">
                    <label for="rol">Rol Asignado</label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona un rol...</option>
                        <option th:each="r : ${todosLosRoles}" 
                                th:value="${r}" 
                                th:text="${r}" 
                                th:selected="${usuario.rol == r}">
                        </option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <div class="checkbox-group">
                        <input type="checkbox" id="activo" name="activo" th:checked="${usuario.activo}">
                        <label for="activo" style="text-transform:none; font-size:0.9rem; font-weight:500;">Usuario Activo en el Sistema</label>
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/usuarios" class="btn-outline" style="background:transparent; color:#485A48; border:1px solid #485A48; padding:11px 26px;">← Cancelar</a>
                <button type="submit" class="btn">Guardar Profesional</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

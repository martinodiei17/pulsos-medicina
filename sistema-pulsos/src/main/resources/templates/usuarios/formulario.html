<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuario / Profesional</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <div class="container mt-5">
        <h2 th:text="${esEdicion} ? 'Editar Usuario / Profesional' : 'Nuevo Usuario / Profesional'">Formulario</h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-4">
            
            <!-- ID oculto para saber si estamos actualizando -->
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{activo}" />

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario (Login)</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" required />
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label for="passwordPlana" class="form-label">Contraseña</label>
                <input type="password" id="passwordPlana" name="passwordPlana" class="form-control" 
                       th:placeholder="${esEdicion} ? 'Dejar en blanco para mantener la actual' : 'Ingrese contraseña'" 
                       th:required="${!esEdicion}" />
                <div class="form-text" th:if="${esEdicion}">Si no deseas cambiar la contraseña, deja este campo vacío.</div>
            </div>

            <!-- Nombre Completo -->
            <div class="mb-3">
                <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control" />
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" />
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" id="telefono" th:field="*{telefono}" class="form-control" />
            </div>

            <!-- Campos exclusivos de Profesionales / Médicos -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <input type="text" id="especialidad" th:field="*{especialidad}" class="form-control" />
                </div>
                <div class="col-md-6 mb-3">
                    <label for="matricula" class="form-label">Matrícula</label>
                    <input type="text" id="matricula" th:field="*{matricula}" class="form-control" />
                </div>
            </div>

            <!-- Selección de Roles -->
            <div class="mb-3">
                <label class="form-label">Roles del Sistema</label>
                <div th:each="rol : ${todosLosRoles}" class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${rol}" th:id="${'rol_' + rol}">
                    <label class="form-check-label" th:for="${'rol_' + rol}" th:text="${rol}"></label>
                </div>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuario - Pulsos Medicina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Barra Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/turnos}">
                <i class="bi bi-heart-pulse-fill me-2"></i>Pulsos Medicina
            </a>
            <div class="d-flex">
                <a th:href="@{/usuarios}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-people me-1"></i>Volver a Usuarios
                </a>
            </div>
        </div>
    </nav>

    <!-- Tarjeta del Formulario -->
    <main class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="card-title mb-0 text-primary fw-semibold">
                            <i class="bi bi-person-gear me-2"></i>Editar / Crear Usuario
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/usuarios/guardar}" method="post">
                            
                            <!-- ID -->
                            <input type="hidden" name="id" th:value="${usuario != null ? usuario.id : ''}" />

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" 
                                           th:value="${usuario != null ? usuario.username : ''}" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" 
                                           placeholder="Dejar en blanco para conservar la actual">
                                </div>
                                <small class="text-muted">Si estás editando, solo escribe una contraseña si deseas cambiarla.</small>
                            </div>

                            <!-- Rol -->
                            <div class="mb-4">
                                <label for="rol" class="form-label fw-semibold">Rol</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <select class="form-select" id="rol" name="rol" required>
                                        <option value="ADMIN" th:selected="${usuario != null and #strings.contains(usuario.rol, 'ADMIN')}">ADMIN</option>
                                        <option value="MEDICO" th:selected="${usuario != null and #strings.contains(usuario.rol, 'MEDICO')}">MEDICO</option>
                                        <option value="RECEPCION" th:selected="${usuario != null and #strings.contains(usuario.rol, 'RECEPCION')}">RECEPCION</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Acciones -->
                            <div class="d-flex justify-content-between pt-3 border-top">
                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle me-1"></i>Guardar Cambios
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

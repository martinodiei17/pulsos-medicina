<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario - Pulsos Medicina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/turnos}">
                <i class="bi bi-heart-pulse-fill me-2"></i>Pulsos Medicina
            </a>
            <div class="d-flex">
                <a th:href="@{/usuarios}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-people me-1"></i>Volver a Usuarios
                </a>
            </div>
        </div>
    </nav>

    <!-- Formulario -->
    <main class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="card-title mb-0 text-primary fw-semibold" 
                            th:text="${esEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'">
                            Usuario
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/usuarios/guardar}" method="post">
                            
                            <!-- ID oculto -->
                            <input type="hidden" name="id" th:value="${usuario.id}" />

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" 
                                           th:value="${usuario.username}" required placeholder="Ej: jdoe">
                                </div>
                            </div>

                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                    <input type="text" class="form-control" id="nombre" name="nombre" 
                                           th:value="${usuario.nombre}" placeholder="Ej: Juan Pérez">
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="passwordPlana" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="passwordPlana" name="passwordPlana" 
                                           th:required="${!esEdicion}" placeholder="Ingresa la clave">
                                </div>
                                <small class="form-text text-muted" th:if="${esEdicion}">
                                    Dejar en blanco si deseas conservar la contraseña actual.
                                </small>
                            </div>

                            <!-- Rol -->
                            <div class="mb-3">
                                <label for="rol" class="form-label fw-semibold">Rol del Sistema</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <select class="form-select" id="rol" name="rol" required>
                                        <option value="" disabled th:selected="${usuario.rol == null}">Selecciona un rol...</option>
                                        <option th:each="r : ${todosLosRoles}" 
                                                th:value="${r}" 
                                                th:text="${r}"
                                                th:selected="${usuario.rol != null and usuario.rol == r}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- Estado Activo -->
                            <div class="mb-4 form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="activo" name="activo" 
                                       th:checked="${usuario.activo != null ? usuario.activo : true}">
                                <label class="form-check-label fw-semibold" for="activo">Usuario activo</label>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-between pt-3 border-top">
                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Volver
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle me-1"></i>Guardar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

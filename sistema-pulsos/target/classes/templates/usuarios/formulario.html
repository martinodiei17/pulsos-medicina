<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id != null} ? 'Editar Usuario - Pulsos Medicina' : 'Nuevo Usuario - Pulsos Medicina'">Gestión de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/turnos}">
                <i class="bi bi-heart-pulse-fill me-2"></i>Pulsos Medicina
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/turnos}"><i class="bi bi-calendar-check me-1"></i>Turnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pacientes}"><i class="bi bi-people me-1"></i>Pacientes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link active" th:href="@{/usuarios}"><i class="bi bi-person-gear me-1"></i>Usuarios</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white" sec:authentication="name">Usuario</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Formulario -->
    <main class="container py-2">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h4 class="card-title mb-0 text-primary fw-semibold" 
                            th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">
                            Usuario
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                            
                            <!-- Campo oculto para el ID si se edita -->
                            <input type="hidden" th:field="*{id}" />

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" required placeholder="Ej: jdoe">
                                </div>
                            </div>

                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej: Juan Pérez">
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" th:required="${usuario.id == null}" placeholder="Ingresa la clave">
                                </div>
                                <small class="form-text text-muted" th:if="${usuario.id != null}">
                                    Dejar en blanco si deseas conservar la contraseña actual.
                                </small>
                            </div>

                            <!-- Rol -->
                            <div class="mb-4">
                                <label for="rol" class="form-label fw-semibold">Rol del Sistema</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <select class="form-select" id="rol" th:field="*{rol}" required>
                                        <option value="" disabled selected>Selecciona un rol...</option>
                                        <option value="ADMIN">ADMIN</option>
                                        <option value="MEDICO">MEDICO</option>
                                        <option value="RECEPCION">RECEPCION</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-between pt-2 border-top">
                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Volver
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle me-1"></i>Guardar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
